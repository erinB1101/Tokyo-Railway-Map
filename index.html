<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>도쿄 노선도</title>
<style>
  :root{
    --bg:#0d1117; --panel:#151b23; --panel-border:#242c38;
    --ink:#e6edf3; --ink-dim:#7d8794; --accent:#f2c14e;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
    font-family:"Pretendard","Noto Sans KR","Apple SD Gothic Neo",-apple-system,BlinkMacSystemFont,sans-serif;
    height:100%;}
  #app{display:flex;flex-direction:column;height:100vh;}
  header{padding:16px 22px 10px;border-bottom:1px solid var(--panel-border);flex-shrink:0;
    display:flex;align-items:center;gap:12px;}
  #sidebar-toggle{flex-shrink:0;width:34px;height:34px;border-radius:9px;border:1px solid var(--panel-border);
    background:#1c2430;color:var(--ink);font-size:15px;cursor:pointer;display:flex;
    align-items:center;justify-content:center;}
  #sidebar-toggle:hover{background:#232d3a;}
  header .titles{min-width:0;}
  header h1{margin:0 0 3px;font-size:19px;font-weight:700;letter-spacing:-0.01em;}
  header p{margin:0;font-size:12px;color:var(--ink-dim);}
  #main{display:flex;flex:1;min-height:0;}
  #sidebar{width:240px;flex-shrink:0;border-right:1px solid var(--panel-border);
    display:flex;flex-direction:column;overflow:hidden;background:var(--panel);
    transition:width .22s ease;}
  #sidebar.collapsed{width:0;border-right:none;}
  #search-wrap{padding:10px 10px 6px;flex-shrink:0;position:relative;}
  #search-input{width:100%;padding:8px 10px;border-radius:8px;border:1px solid var(--panel-border);
    background:#0d1117;color:var(--ink);font-size:12.5px;outline:none;}
  #search-input:focus{border-color:var(--accent);}
  #search-results{position:absolute;left:10px;right:10px;top:42px;background:#1c2430;
    border:1px solid #33404f;border-radius:8px;max-height:280px;overflow-y:auto;z-index:20;
    box-shadow:0 8px 24px rgba(0,0,0,.45);display:none;}
  .sr-item{display:flex;align-items:center;gap:7px;padding:7px 10px;font-size:12px;cursor:pointer;}
  .sr-item:hover{background:#242f3d;}
  .sr-chip{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
  .sr-jp{color:var(--ink-dim);font-size:10.5px;margin-left:auto;}
  .sr-empty{padding:10px;font-size:11.5px;color:var(--ink-dim);}
  #legend{overflow-y:auto;flex:1;padding:2px 10px 10px;}
  .legend-section-title{font-size:10.5px;color:var(--ink-dim);text-transform:uppercase;
    letter-spacing:.06em;margin:14px 6px 6px;font-weight:600;}
  .legend-section-title:first-child{margin-top:4px;}
  .line-btn{display:flex;align-items:center;gap:8px;width:100%;padding:7px 8px;
    background:transparent;border:1px solid transparent;border-radius:7px;cursor:pointer;
    color:var(--ink);font-size:12.5px;text-align:left;transition:background .12s;}
  .line-btn:hover{background:#1c2430;}
  .line-btn.active{background:#1e2733;border-color:#33404f;}
  .line-swatch{width:14px;height:14px;border-radius:4px;flex-shrink:0;}
  .line-name{flex:1;line-height:1.25;}
  .line-name small{display:block;color:var(--ink-dim);font-size:10px;}
  .line-name .cnt{color:var(--ink-dim);font-size:10px;}
  #reset-btn{margin:8px 10px 10px;padding:9px;border-radius:8px;border:1px solid var(--panel-border);
    background:#1c2430;color:var(--ink);font-size:12.5px;cursor:pointer;flex-shrink:0;}
  #reset-btn:hover{background:#232d3a;}
  #reset-btn:disabled{opacity:.35;cursor:default;}
  #bookmark-panel{border-top:1px solid var(--panel-border);padding:10px;max-height:28%;
    overflow-y:auto;flex-shrink:0;}
  #bookmark-panel .legend-section-title{margin-top:0;}
  .bm-item{display:flex;align-items:center;gap:6px;padding:5px 6px;font-size:12px;border-radius:6px;cursor:pointer;}
  .bm-item:hover{background:#1c2430;}
  .bm-empty{font-size:11.5px;color:var(--ink-dim);padding:2px 6px;line-height:1.5;}
  #map-wrap{flex:1;position:relative;overflow:hidden;background:
    radial-gradient(ellipse at 35% 30%, #131a24 0%, var(--bg) 65%);cursor:grab;}
  #map-wrap.panning{cursor:grabbing;}
  svg#map{width:100%;height:100%;display:block;touch-action:none;}
  .line-path{fill:none;stroke-linecap:round;stroke-linejoin:round;
    transition:opacity .25s ease, stroke-width .25s ease;}
  .station-dot{transition:opacity .25s ease, r .2s ease, width .2s ease, height .2s ease, x .2s ease, y .2s ease, stroke-width .2s ease;cursor:pointer;}
  .station-label{font-size:8.5px;fill:var(--ink);pointer-events:none;transition:opacity .25s ease;font-weight:500;}
  .station-label.interchange{font-weight:700;font-size:9.5px;}
  .star{transition:opacity .2s ease;pointer-events:none;}
  .pulse-ring{fill:none;stroke:var(--accent);stroke-width:2;opacity:0;pointer-events:none;}
  .pulse-ring.go{animation:pulse 1.4s ease-out 2;}
  @keyframes pulse{0%{r:6;opacity:.9;} 100%{r:26;opacity:0;}}
  #tooltip{position:absolute;pointer-events:none;background:#1c2430;border:1px solid #33404f;
    border-radius:8px;padding:8px 11px;font-size:12px;color:var(--ink);display:none;
    box-shadow:0 6px 20px rgba(0,0,0,.4);max-width:220px;z-index:10;}
  #tooltip .tt-name{font-weight:700;font-size:13px;margin-bottom:2px;}
  #tooltip .tt-jp{color:var(--ink-dim);font-size:11px;margin-bottom:5px;}
  #tooltip .tt-lines{display:flex;flex-wrap:wrap;gap:4px;}
  #tooltip .tt-line-chip{font-size:10px;padding:1px 6px;border-radius:9px;color:#0d1117;font-weight:700;}
  #tooltip .tt-hint{margin-top:6px;color:var(--ink-dim);font-size:10.5px;}
  #hint-banner{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);
    background:#1c2430ee;border:1px solid #33404f;border-radius:20px;padding:7px 16px;
    font-size:11.5px;color:var(--ink-dim);white-space:nowrap;}
  #zoom-controls{position:absolute;top:14px;right:14px;display:flex;flex-direction:column;gap:6px;z-index:8;}
  .zoom-btn{width:34px;height:34px;border-radius:9px;border:1px solid #33404f;background:#1c2430ee;
    color:var(--ink);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
  .zoom-btn:hover{background:#232d3a;}
  .zoom-btn.small{font-size:11px;}
  ::-webkit-scrollbar{width:7px;}
  ::-webkit-scrollbar-thumb{background:#2a3341;border-radius:4px;}

  @media (max-width:720px){
    header{padding:10px 14px 8px;gap:9px;}
    header h1{font-size:15px;}
    header p{display:none;}
    #main{position:relative;}
    #sidebar{position:absolute;top:0;left:0;height:100%;width:84vw;max-width:320px;
      z-index:15;box-shadow:10px 0 30px rgba(0,0,0,.5);
      transition:transform .25s ease;transform:translateX(0);}
    #sidebar.collapsed{width:84vw;transform:translateX(-100%);border-right:1px solid var(--panel-border);}
    .zoom-btn{width:42px;height:42px;font-size:19px;}
    .line-btn{padding:10px 8px;}
    #hint-banner{font-size:10.5px;padding:6px 12px;bottom:8px;max-width:88vw;
      white-space:normal;text-align:center;}
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <button id="sidebar-toggle" title="메뉴 접기/펼치기">☰</button>
    <div class="titles">
      <h1>도쿄 교통 노선도</h1>
      <p>각 노선의 전체 정차역 포함 — 정거장 수 계산용으로도 사용 가능</p>
    </div>
  </header>
  <div id="main">
    <div id="sidebar">
      <div id="search-wrap">
        <input id="search-input" type="text" placeholder="역 검색 (영문/일문) 예: Shibuya">
        <div id="search-results"></div>
      </div>
      <button id="reset-btn" disabled>전체 노선 보기</button>
      <div id="legend"></div>
      <div id="bookmark-panel">
        <div class="legend-section-title">★ 즐겨찾는 역</div>
        <div id="bm-list"></div>
      </div>
    </div>
    <div id="map-wrap">
      <svg id="map" viewBox="0 0 1000 800" preserveAspectRatio="xMidYMid meet"></svg>
      <div id="zoom-controls">
        <button class="zoom-btn" id="zoom-in" title="확대">+</button>
        <button class="zoom-btn" id="zoom-out" title="축소">−</button>
        <button class="zoom-btn small" id="zoom-reset" title="전체 보기">⤢</button>
      </div>
      <div id="tooltip"></div>
      <div id="hint-banner">스크롤로 확대/축소 · 드래그로 이동 · 노선 여러 개 동시 선택 가능</div>
    </div>
  </div>
</div>

/* ---------------- AUTO-INTERPOLATE missing coordinates ---------------- */
lines.forEach(line=>{
  const ids = line.stations;
  let i = 0;
  while(i < ids.length){
    if(stations[ids[i]].x !== undefined){ i++; continue; }
    const startIdx = i - 1, a = stations[ids[startIdx]];
    let endIdx = i;
    while(endIdx < ids.length && stations[ids[endIdx]].x === undefined) endIdx++;
    const b = stations[ids[endIdx]];
    const n = endIdx - startIdx;
    for(let k = startIdx+1; k < endIdx; k++){
      const t = (k-startIdx)/n, sid = ids[k];
      if(stations[sid].x === undefined){
        stations[sid].x = a.x + (b.x-a.x)*t;
        stations[sid].y = a.y + (b.y-a.y)*t;
      }
    }
    i = endIdx;
  }
});

/* ---------------- label placement (avoid overlaps) ---------------- */
function layoutLabels(){
  const CHAR_W = {normal:4.5, interchange:5.1};
  const placed = [];
  const order = Object.keys(stations).sort((a,b)=>{
    const da = (stationLineMap[a]||[]).length, db = (stationLineMap[b]||[]).length;
    return db - da;
  });
  const dirs = [
    {ax:1, ay:0, anchor:"start"}, {ax:0.72,ay:-0.72, anchor:"start"}, {ax:0.72,ay:0.72, anchor:"start"},
    {ax:0, ay:-1, anchor:"middle"}, {ax:0, ay:1, anchor:"middle"},
    {ax:-1, ay:0, anchor:"end"}, {ax:-0.72,ay:-0.72, anchor:"end"}, {ax:-0.72,ay:0.72, anchor:"end"},
  ];
  function bboxFor(sid, dir){
    const st = stations[sid];
    const isInterchange = stationShape[sid] === "circle";
    const baseR = isInterchange ? 8 : 7.5;
    const w = st.en.length * (isInterchange?CHAR_W.interchange:CHAR_W.normal);
    const h = isInterchange ? 11.5 : 10.5;
    const lx = st.x + dir.ax*baseR, ly = st.y + dir.ay*baseR + (dir.ay===0? h*0.32 : (dir.ay<0? 0 : h*0.85));
    let xmin, xmax;
    if(dir.anchor==="start"){ xmin=lx; xmax=lx+w; }
    else if(dir.anchor==="end"){ xmin=lx-w; xmax=lx; }
    else { xmin=lx-w/2; xmax=lx+w/2; }
    return {xmin, xmax, ymin: ly-h*0.8, ymax: ly+h*0.3, lx, ly};
  }
  function overlapArea(b1, b2){
    const ox = Math.max(0, Math.min(b1.xmax,b2.xmax) - Math.max(b1.xmin,b2.xmin));
    const oy = Math.max(0, Math.min(b1.ymax,b2.ymax) - Math.max(b1.ymin,b2.ymin));
    return ox*oy;
  }
  order.forEach(sid=>{
    let best = null, bestScore = Infinity;
    for(const dir of dirs){
      const box = bboxFor(sid, dir);
      let score = 0;
      for(const p of placed) score += overlapArea(box, p);
      if(score === 0){ best = {dir, box}; break; }
      if(score < bestScore){ bestScore = score; best = {dir, box}; }
    }
    placed.push(best.box);
    const label = stationLabelEls[sid];
    label.setAttribute("x", best.box.lx);
    label.setAttribute("y", best.box.ly);
    label.setAttribute("text-anchor", best.dir.anchor);
  });
}
layoutLabels();

/* ---------------- highlight ---------------- */
function applyHighlight(){
  const noneActive = activeLines.size === 0;
  Object.keys(linePathEls).forEach(lid=>{
    const path = linePathEls[lid];
    if(noneActive){ path.setAttribute("opacity",0.85); path.setAttribute("stroke-width",3.6); }
    else if(activeLines.has(lid)){ path.setAttribute("opacity",1); path.setAttribute("stroke-width",6); }
    else { path.setAttribute("opacity",0.08); path.setAttribute("stroke-width",2.5); }
  });
  Object.keys(stations).forEach(sid=>{
    const linesHere = (stationLineMap[sid]||[]).map(l=>l.id);
    const onActive = noneActive || linesHere.some(id=>activeLines.has(id));
    const bookmarked = bookmarks.has(sid);
    const dot = stationDotEls[sid], label = stationLabelEls[sid];
    const showLabel = noneActive ? bookmarked : (onActive || bookmarked);
    if(onActive || bookmarked){ dot.style.opacity=1; }
    else { dot.style.opacity=0.15; }
    label.style.opacity = showLabel ? 1 : 0;
  });
  document.querySelectorAll(".line-btn").forEach(btn=>btn.classList.toggle("active", activeLines.has(btn.dataset.line)));
  document.getElementById("reset-btn").disabled = noneActive;
}

function renderStars(){
  Object.keys(starEls).forEach(sid=>{
    const has = bookmarks.has(sid);
    starEls[sid].setAttribute("opacity", has?1:0);
    const dot = stationDotEls[sid];
    const st = stations[sid];
    const isInterchange = stationShape[sid] === "circle";
    const linesHere = stationLineMap[sid]||[];
    const color = linesHere[0] ? linesHere[0].color : "#888";
    if(isInterchange){
      dot.setAttribute("r", has?8:5.5);
      dot.setAttribute("stroke", has?"#f2c14e":color);
      dot.setAttribute("stroke-width", has?2.6:2.4);
    } else {
      const size = has?12:8.5;
      dot.setAttribute("x", st.x - size/2); dot.setAttribute("y", st.y - size/2);
      dot.setAttribute("width", size); dot.setAttribute("height", size);
      dot.setAttribute("stroke", has?"#f2c14e":"#0d1117");
      dot.setAttribute("stroke-width", has?2.2:1.3);
    }
  });
}

/* ---------------- zoom / pan ---------------- */
function clampViewBox(){
  vb.w = Math.max(VB_MIN_W, Math.min(VB_MAX_W, vb.w));
  vb.h = vb.w * ASPECT;
  vb.x = Math.max(-220, Math.min(1100 - vb.w + 220, vb.x));
  vb.y = Math.max(-120, Math.min(800 - vb.h + 120, vb.y));
}
function animateViewBox(target, duration){
  const start = {...vb}; const t0 = performance.now();
  function step(now){
    const t = Math.min(1, (now - t0) / duration), ease = 1 - Math.pow(1-t, 3);
    vb = { x: start.x + (target.x-start.x)*ease, y: start.y + (target.y-start.y)*ease,
           w: start.w + (target.w-start.w)*ease, h: start.h + (target.h-start.h)*ease };
    updateViewBox();
    if(t < 1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}
svg.addEventListener("wheel", (e)=>{
  e.preventDefault();
  const rect = svg.getBoundingClientRect();
  const px = (e.clientX - rect.left) / rect.width, py = (e.clientY - rect.top) / rect.height;
  const scale = e.deltaY > 0 ? 1.15 : 0.87;
  const newW = Math.max(VB_MIN_W, Math.min(VB_MAX_W, vb.w * scale)), newH = newW * ASPECT;
  vb.x = vb.x + px * (vb.w - newW); vb.y = vb.y + py * (vb.h - newH);
  vb.w = newW; vb.h = newH; clampViewBox(); updateViewBox();
}, {passive:false});

let isPanning=false, panStart=null, vbStart=null;
svg.addEventListener("mousedown", (e)=>{ isPanning=true; mapWrap.classList.add("panning"); panStart={x:e.clientX,y:e.clientY}; vbStart={...vb}; });
window.addEventListener("mousemove", (e)=>{
  if(!isPanning) return;
  const rect = svg.getBoundingClientRect();
  const dx = (e.clientX - panStart.x) * (vb.w / rect.width), dy = (e.clientY - panStart.y) * (vb.h / rect.height);
  vb.x = vbStart.x - dx; vb.y = vbStart.y - dy; clampViewBox(); updateViewBox();
});
window.addEventListener("mouseup", ()=>{ isPanning=false; mapWrap.classList.remove("panning"); });

/* ---- touch: one-finger pan, two-finger pinch zoom ---- */
let touchState = null;
function touchDist(t0,t1){ return Math.hypot(t0.clientX-t1.clientX, t0.clientY-t1.clientY); }
svg.addEventListener("touchstart", (e)=>{
  if(e.touches.length === 1){
    touchState = {mode:"pan", x:e.touches[0].clientX, y:e.touches[0].clientY, vbStart:{...vb}};
  } else if(e.touches.length === 2){
    const rect = svg.getBoundingClientRect();
    touchState = {
      mode:"pinch", dist: touchDist(e.touches[0], e.touches[1]), vbStart:{...vb},
      midX:(e.touches[0].clientX+e.touches[1].clientX)/2 - rect.left,
      midY:(e.touches[0].clientY+e.touches[1].clientY)/2 - rect.top,
      rectW: rect.width, rectH: rect.height
    };
  }
}, {passive:true});
svg.addEventListener("touchmove", (e)=>{
  if(!touchState) return;
  e.preventDefault();
  if(touchState.mode==="pan" && e.touches.length===1){
    const rect = svg.getBoundingClientRect();
    const dx = (e.touches[0].clientX - touchState.x) * (vb.w/rect.width);
    const dy = (e.touches[0].clientY - touchState.y) * (vb.h/rect.height);
    vb.x = touchState.vbStart.x - dx; vb.y = touchState.vbStart.y - dy;
    clampViewBox(); updateViewBox();
  } else if(touchState.mode==="pinch" && e.touches.length===2){
    const dist = touchDist(e.touches[0], e.touches[1]);
    const scale = touchState.dist / Math.max(1,dist);
    const newW = Math.max(VB_MIN_W, Math.min(VB_MAX_W, touchState.vbStart.w * scale));
    const newH = newW * ASPECT;
    const px = touchState.midX/touchState.rectW, py = touchState.midY/touchState.rectH;
    vb.x = touchState.vbStart.x + px*(touchState.vbStart.w-newW);
    vb.y = touchState.vbStart.y + py*(touchState.vbStart.h-newH);
    vb.w = newW; vb.h = newH;
    clampViewBox(); updateViewBox();
  }
}, {passive:false});
svg.addEventListener("touchend", (e)=>{ if(e.touches.length===0) touchState=null; });
svg.addEventListener("touchcancel", ()=>{ touchState=null; });

document.getElementById("zoom-in").addEventListener("click", ()=>{
  const newW = Math.max(VB_MIN_W, vb.w*0.75), cx = vb.x+vb.w/2, cy = vb.y+vb.h/2;
  animateViewBox({x:cx-newW/2, y:cy-(newW*ASPECT)/2, w:newW, h:newW*ASPECT}, 250);
});
document.getElementById("zoom-out").addEventListener("click", ()=>{
  const newW = Math.min(VB_MAX_W, vb.w*1.33), cx = vb.x+vb.w/2, cy = vb.y+vb.h/2;
  animateViewBox({x:cx-newW/2, y:cy-(newW*ASPECT)/2, w:newW, h:newW*ASPECT}, 250);
});
document.getElementById("zoom-reset").addEventListener("click", ()=>{ animateViewBox({x:0,y:0,w:1000,h:800}, 350); });

/* ---------------- init ---------------- */
updateViewBox();
applyHighlight();
loadBookmarks();
</script>
</body>
</html>
